<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>ระบบออกบัตรคิวสำหรับเจ้าหน้าที่ - QueueCare</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- โหลด Library สำหรับสร้าง QR Code -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Prompt', sans-serif; }
    /* ซ่อนส่วนที่ไม่ต้องการพิมพ์เวลาสั่ง Print */
    @media print {
      .no-print { display: none !important; }
      .print-only { display: block !important; }
    }
  </style>
</head>
<body class="bg-slate-100 min-h-screen p-6">

  <!-- ================= ส่วนฟอร์มของพยาบาล (ไม่พิมพ์ออกกระดาษ) ================= -->
  <div class="max-w-md mx-auto bg-white p-6 rounded-2xl shadow-md space-y-4 no-print">
    <h2 class="text-xl font-bold text-[#1B4332] border-b pb-2">🏥 ออกบัตรคิวผู้ป่วยใหม่</h2>
    
    <div>
      <label class="text-xs font-semibold text-slate-600">ชื่อ-นามสกุล ผู้ป่วย</label>
      <input type="text" id="patientName" placeholder="เช่น คุณ สมหญิง รักดี" class="w-full border rounded-xl p-2.5 text-sm mt-1 focus:outline-none focus:ring-2 focus:ring-[#2D6A4F]">
    </div>

    <div>
      <label class="text-xs font-semibold text-slate-600">แผนกตรวจ</label>
      <select id="department" class="w-full border rounded-xl p-2.5 text-sm mt-1">
        <option value="แผนกอายุรกรรม">แผนกอายุรกรรม</option>
        <option value="แผนกศัลยกรรม">แผนกศัลยกรรม</option>
        <option value="แผนกกุมารเวชกรรม">แผนกกุมารเวชกรรม</option>
      </select>
    </div>

    <button onclick="issueQueue()" class="w-full bg-[#1B4332] hover:bg-[#2D6A4F] text-white font-bold py-3 rounded-xl transition shadow">
      🖨️ บันทึกข้อมูล & พิมพ์สลิปคิว
    </button>
  </div>

  <!-- ================= ส่วนสลิปใบคิว (สำหรับพิมพ์ออกเครื่องพิมพ์ thermal/สลิป) ================= -->
  <div id="printableSlip" class="hidden print-only max-w-[300px] mx-auto p-4 bg-white border border-stone-300 text-center space-y-3 rounded-lg">
    <div class="border-b border-dashed pb-2">
      <h3 class="font-bold text-lg text-black">โรงพยาบาล QueueCare</h3>
      <p class="text-xs text-stone-600">ใบนัดหมายและติดตามคิวบริการ</p>
    </div>

    <div>
      <p class="text-xs text-stone-500">หมายเลขคิวของคุณ</p>
      <h1 id="slipQueueNum" class="text-4xl font-black text-black py-1">A-000</h1>
      <p id="slipDept" class="text-xs font-semibold text-stone-700">แผนกอายุรกรรม</p>
    </div>

    <div class="text-left text-xs space-y-1 bg-stone-50 p-2 rounded border border-stone-200">
      <p><strong>ชื่อผู้ป่วย:</strong> <span id="slipPatientName">-</span></p>
      <p><strong>วันที่:</strong> <span id="slipDate">-</span></p>
    </div>

    <!-- กล่องแสดง QR Code สำหรับคนไข้สแกน -->
    <div class="py-2 flex flex-col items-center justify-center space-y-1">
      <div id="qrcode"></div>
      <p class="text-[10px] text-stone-600 font-medium mt-1">สแกน QR Code เพื่อดูคิวสดเรียลไทม์</p>
    </div>

    <div class="border-t border-dashed pt-2 text-[10px] text-stone-500">
      <p>ขอบคุณที่ใช้บริการ / Thank you</p>
    </div>
  </div>

  <script>
    // 1. ฟังก์ชัน Auto Authentication
    async function autoAuthenticate() {
      if (localStorage.getItem('access_token')) {
        return localStorage.getItem('access_token');
      }

      const email = 'nurse@hospital.com';
      const password = 'password123';

      try {
        let res = await fetch('/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: new URLSearchParams({
            'username': email,
            'password': password
          })
        });

        if (!res.ok) {
          await fetch('/auth/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              name: 'พยาบาลประจำเคาน์เตอร์',
              email: email,
              password: password,
              role: 'nurse'
            })
          });

          res = await fetch('/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: new URLSearchParams({
              'username': email,
              'password': password
            })
          });
        }

        if (res.ok) {
          const data = await res.json();
          localStorage.setItem('access_token', data.access_token);
          return data.access_token;
        }
      } catch (err) {
        console.error('❌ Auto Auth error:', err);
      }
      return null;
    }

    // 2. ฟังก์ชันดึง User ID ปัจจุบันจาก Backend /auth/me
    async function getCurrentUserId(token) {
      try {
        const res = await fetch('/auth/me', {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        if (res.ok) {
          const user = await res.json();
          return user.id;
        }
      } catch (err) {
        console.error('❌ Get User ID error:', err);
      }
      return 1; // Fallback default ID
    }

    window.addEventListener('DOMContentLoaded', autoAuthenticate);

    // 3. ฟังก์ชันออกบัตรคิว
    async function issueQueue() {
      const name = document.getElementById('patientName').value.trim();
      const dept = document.getElementById('department').value;

      if (!name) {
        alert('กรุณากรอกชื่อผู้ป่วย');
        return;
      }

      let token = localStorage.getItem('access_token');
      if (!token) {
        token = await autoAuthenticate();
      }

      // ดึง user_id ของผู้ล็อกอิน
      const userId = await getCurrentUserId(token);
      
      // สุ่มสร้างหมายเลขคิว เช่น A-105
      const generatedQueueNum = "A-" + Math.floor(100 + Math.random() * 900);

      try {
        const response = await fetch('/queues/', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': token ? `Bearer ${token}` : ''
          },
          body: JSON.stringify({
            number: generatedQueueNum,
            user_id: userId,
            patient_name: name,
            department: dept
          })
        });

        if (!response.ok) {
          const errorData = await response.json();
          let errorMessage = 'เกิดข้อผิดพลาดในการบันทึก';
          if (Array.isArray(errorData.detail)) {
            errorMessage = errorData.detail.map(err => `• ${err.loc ? err.loc.join('.') : 'field'}: ${err.msg}`).join('\n');
          } else if (typeof errorData.detail === 'string') {
            errorMessage = errorData.detail;
          }
          alert('ไม่สามารถบันทึกคิวได้:\n' + errorMessage);
          return;
        }

        const data = await response.json();
        const finalQueueNumber = data.number || data.queue_number || generatedQueueNum;

        // อัปเดตข้อมูลบนสลิป
        document.getElementById('slipPatientName').innerText = name;
        document.getElementById('slipDept').innerText = dept;
        document.getElementById('slipQueueNum').innerText = finalQueueNumber;
        document.getElementById('slipDate').innerText = new Date().toLocaleString('th-TH');

        // สร้าง QR Code สำหรับคนไข้
        const trackUrl = `${window.location.origin}/track?q=${finalQueueNumber}&name=${encodeURIComponent(name)}`;
        document.getElementById('qrcode').innerHTML = "";
        new QRCode(document.getElementById("qrcode"), {
          text: trackUrl,
          width: 120,
          height: 120
        });

        // แสดงสลิปและสั่งพิมพ์
        document.getElementById('printableSlip').classList.remove('hidden');
        setTimeout(() => {
          window.print();
        }, 300);

      } catch (err) {
        console.error(err);
        alert('ไม่สามารถเชื่อมต่อกับเซิร์ฟเวอร์ได้');
      }
    }
  </script>
</body>
</html>
